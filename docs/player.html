<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LOVE-12 Runtime Sandbox</title>
  <style>
    /* Full-bleed canvas matching Tapioca #131218 background */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #131218;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
    }
  </style>
</head>
<body>
  <!-- SDL3 / OpenGL ES renders LÖVE frames directly onto this canvas -->
  <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>

  <!-- Boot controller that receives the .love ArrayBuffer and loads love.js -->
  <script src="https://cdn.jsdelivr.net/gh/ArkaneelRoy/love.js@main/love.js"></script>
  <script src="player.js"></script>
</body>
</html>
